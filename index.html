<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSort AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🌱 EcoSort AI</h1>

    <p class="subtitle">
        AI-powered Waste Segregation Assistant using IBM Granite
    </p>

    <div class="status">
        <span class="dot"></span>
        AI Model Ready
    </div>

    <input
        id="itemInput"
        type="text"
        list="wasteSuggestions"
        placeholder="Enter a waste item..."
    >

    <datalist id="wasteSuggestions">

        <!-- ♻️ Plastic -->
        <option value="Plastic Bottle">
        <option value="Plastic Bag">
        <option value="Plastic Container">
        <option value="Shampoo Bottle">
        <option value="Milk Carton">
        <option value="Toothpaste Tube">
        <option value="Detergent Bottle">
        <option value="Water Bottle">
        <option value="Food Wrapper">
        <option value="Plastic Spoon">
        
        <!-- 📄 Paper -->
        <option value="Paper">
        <option value="Newspaper">
        <option value="Magazine">
        <option value="Cardboard">
        <option value="Pizza Box">
        <option value="Paper Cup">
        <option value="Paper Plate">
        <option value="Notebook">
        <option value="Office Paper">
        <option value="Envelope">
        
        <!-- 🍾 Glass -->
        <option value="Glass Bottle">
        <option value="Glass Jar">
        <option value="Broken Glass">
        <option value="Perfume Bottle">
        <option value="Glass Cup">
        
        <!-- 🥫 Metal -->
        <option value="Aluminium Can">
        <option value="Tin Can">
        <option value="Steel Can">
        <option value="Aluminium Foil">
        <option value="Beverage Can">
        
        <!-- 🍌 Organic -->
        <option value="Banana Peel">
        <option value="Apple Core">
        <option value="Orange Peel">
        <option value="Eggshell">
        <option value="Tea Leaves">
        <option value="Coffee Grounds">
        <option value="Vegetable Waste">
        <option value="Fruit Waste">
        <option value="Flower Waste">
        <option value="Bread">
        
        <!-- 🔋 Hazardous -->
        <option value="Battery">
        <option value="Medicine">
        <option value="Paint Can">
        <option value="Light Bulb">
        <option value="CFL Bulb">
        <option value="Thermometer">
        <option value="Aerosol Can">
        
        <!-- 💻 E-Waste -->
        <option value="Laptop">
        <option value="Mobile Phone">
        <option value="Keyboard">
        <option value="Mouse">
        <option value="Charger">
        <option value="USB Drive">
        <option value="Earphones">
        <option value="Power Bank">
        <option value="Router">
        
        <!-- 👕 Textile -->
        <option value="Old Clothes">
        <option value="Shoes">
        <option value="Bag">
        <option value="Towel">
    
    </datalist>
    
    <button onclick="classifyWaste()">
        Classify Waste
    </button>

    <div id="result"></div>

    <div class="info">

        <div class="card">
            <h3>Recycling Tips</h3>
            <p id="tips">
                Enter a waste item to receive recycling tips.
            </p>
        </div>

        <div class="card">
            <h3>Environmental Impact</h3>
            <p id="impact">
                Proper waste segregation helps reduce pollution and supports recycling.
            </p>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
