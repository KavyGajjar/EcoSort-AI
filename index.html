<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSort AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>🌱 EcoSort AI</h1>
    <p class="subtitle">
      AI-powered Waste Segregation Assistant using IBM Granite
    </p>
    <input
    id="itemInput"
    type="text"
    placeholder="Enter a waste item (Example: Plastic Bottle)"
    >
    <button onclick="classifyWaste()">
    Classify Waste
    </button>
  <div id="result"></div>
    <div class="info">
    <div class="card">
        <h3>Recycling Tips</h3>
        <p id="tips">
            Enter a waste item to receive recycling tips.
        </p>
    </div>

    <div class="card">
        <h3>Environmental Impact</h3>
        <p id="impact">
            Proper waste segregation helps reduce pollution and supports recycling.
        </p>
    </div>
</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
